experiment:
  name: defectgan_paper_baseline_1024
  seed: 42
  description: Paper core objective at approved project-native 1024 RGB resolution;
    VRAM unverified
data:
  image_size: 1024
  channels: 3
  data_root: .
  train_manifest: training/manifests/train.csv
  val_manifest: training/manifests/val.csv
  test_manifest: training/manifests/test.csv
  num_workers: 4
  pin_memory: true
model:
  generator:
    base_channels: 64
    num_resblocks: 6
    num_classes: 1
    use_spade: true
    use_noise_injection: true
  discriminator:
    base_channels: 64
    num_scales: 1
    num_classes: 1
    num_layers: 6
  architecture: defectgan_paper_baseline
training:
  device: auto
  batch_size: 1
  gradient_accumulation_steps: 4
  mixed_precision: auto
  epochs: 200
  optimizer:
    lr_g: 0.0001
    lr_d: 0.0001
    beta1: 0.5
    beta2: 0.999
    weight_decay: 0.0
  scheduler:
    type: linear_decay
    decay_start_epoch: 100
  loss_weights:
    lambda_cls_real: 2.0
    lambda_cls_fake: 5.0
    lambda_rec: 5.0
    lambda_sd_cyc: 5.0
    lambda_sd_con: 1.0
    lambda_gp: 10.0
  checkpoint_interval: 10
  validation_interval: 1
  sample_interval: 5
  n_critic: 5
output:
  root: outputs
  save_rgb_samples: true
  save_checkpoints: true
