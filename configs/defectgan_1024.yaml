experiment:
  name: f971_defectgan_1024_baseline
  seed: 42
  description: "Defect-GAN baseline for F971 Scratch synthesis at 1024x1024 native RGB resolution"

data:
  image_size: 1024
  channels: 3
  data_root: .  # Mount /workspace/data in Docker or project root on host
  train_manifest: training/manifests/train.csv
  val_manifest: training/manifests/val.csv
  test_manifest: training/manifests/test.csv
  num_workers: 4
  pin_memory: true

model:
  generator:
    base_channels: 64
    num_resblocks: 6
    num_classes: 1  # 1 defect class: Scratch
    use_spade: true
    use_noise_injection: true
  discriminator:
    base_channels: 64
    num_scales: 2  # Multi-scale PatchGAN (1.0x and 0.5x)
    num_classes: 1

training:
  device: auto  # 'auto' selects cuda if available, else cpu
  batch_size: 1  # Standard for 1024x1024 resolution to fit in modern VRAM
  gradient_accumulation_steps: 4  # Effective batch size = 4
  mixed_precision: auto  # Uses torch.amp fp16 on CUDA
  epochs: 200

  optimizer:
    lr_g: 0.0001
    lr_d: 0.0004
    beta1: 0.0
    beta2: 0.999
    weight_decay: 0.0001

  scheduler:
    type: linear_decay
    decay_start_epoch: 100

  loss_weights:
    lambda_adv: 1.0
    lambda_cls: 1.0
    lambda_cyc: 10.0
    lambda_rec: 10.0
    lambda_mask: 0.1

  checkpoint_interval: 10
  validation_interval: 1
  sample_interval: 5

output:
  root: outputs
  save_rgb_samples: true
  save_checkpoints: true
